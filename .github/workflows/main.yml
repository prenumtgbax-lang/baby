name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SMSIFYHUB APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install unzip
      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Extract Android ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "SMSIFYHUB_Android_Project_UPDATED.zip" \
            -not -path "*/.git/*" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Android project extracted."

          test -f "$GITHUB_WORKSPACE/project/gradlew"
          test -f "$GITHUB_WORKSPACE/project/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/project/app/build.gradle.kts"

      # 5. Fix the exact Kotlin error from your log
      - name: Fix PhoneCall Import
        shell: bash
        run: |
          set -euo pipefail

          FILE="$GITHUB_WORKSPACE/project/app/src/main/java/com/smsifyhub/app/ui/FloatingPopupView.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: FloatingPopupView.kt not found."
            exit 1
          fi

          sed -i \
            '/^import androidx\.compose\.material\.icons\.filled\.PhoneCall$/d' \
            "$FILE"

          echo "Checking PhoneCall import..."

          if grep -n 'import androidx.compose.material.icons.filled.PhoneCall' "$FILE"; then
            echo "ERROR: PhoneCall import still exists."
            exit 1
          else
            echo "PhoneCall import fixed."
          fi

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Verify Java and Gradle
      - name: Verify Build Environment
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          java -version
          ./gradlew --version

      # 9. Build Debug APK
      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
