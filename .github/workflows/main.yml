name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SMSIFYHUB APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "SMSIFYHUB_Android_Project_UPDATED.zip" \
            -not -path "*/.git/*" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Project extracted successfully."

          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 4 -type f | head -150

      # 4. Find Gradle project
      - name: Locate Android Project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/project"

          WRAPPER=$(find "$ROOT" \
            -type f \
            -name gradlew \
            -not -path "*/.git/*" | head -n 1 || true)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project: $PROJECT_DIR"

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 6. Accept Android licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          yes | "$SDKMANAGER" --licenses || true

      # 7. Detect compileSdk
      - name: Detect Android SDK Version
        id: sdk
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE=""

          if [ -f app/build.gradle ]; then
            FILE="app/build.gradle"
          elif [ -f app/build.gradle.kts ]; then
            FILE="app/build.gradle.kts"
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          SDK=$(grep -E 'compileSdk(Version)?[[:space:]=]+[0-9]+' \
            "$FILE" | grep -oE '[0-9]+' | head -n 1 || true)

          if [ -z "$SDK" ]; then
            echo "ERROR: Cannot detect compileSdk."
            echo "Check app/build.gradle manually."
            exit 1
          fi

          echo "api=$SDK" >> "$GITHUB_OUTPUT"

          echo "Detected compileSdk: $SDK"

      # 8. Install Android SDK
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${{ steps.sdk.outputs.api }}"

      # 9. Check Gradle and Java
      - name: Check Build Environment
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          java -version
          ./gradlew --version

      # 10. Compile Kotlin and capture detailed errors
      - name: Compile Kotlin
        id: kotlin
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set +e

          ./gradlew \
            --no-daemon \
            :app:compileDebugKotlin \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/kotlin-error.log"

          RESULT=${PIPESTATUS[0]}

          echo "===== KOTLIN COMPILATION ERRORS ====="

          grep -n -B 5 -A 8 -E \
            'e: file:|error:|Unresolved reference|Type mismatch|Compilation error|What went wrong' \
            "$GITHUB_WORKSPACE/kotlin-error.log" || true

          exit "$RESULT"

      # 11. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            assembleDebug \
            --stacktrace

      # 12. Upload APK
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # 13. Upload error log if build fails
      - name: Upload Kotlin Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Build-Error-Log
          path: kotlin-error.log
          if-no-files-found: ignore
          retention-days: 7
