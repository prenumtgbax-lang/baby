name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SMSIFYHUB APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SMSIFYHUB_Android_Project_COMPLETED (1).zip" \
            -not -path "*/.git/*" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            echo "Expected file: SMSIFYHUB_Android_Project_COMPLETED (1).zip"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          if [ ! -f project/gradlew ]; then
            echo "ERROR: gradlew not found in project root."
            exit 1
          fi

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "Project extracted successfully."

      - name: Fix PhoneCall Import
        shell: bash
        run: |
          set -euo pipefail

          FILE="project/app/src/main/java/com/smsifyhub/app/ui/FloatingPopupView.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: FloatingPopupView.kt not found."
            exit 1
          fi

          sed -i \
            '/^import androidx\.compose\.material\.icons\.filled\.PhoneCall$/d' \
            "$FILE"

          echo "PhoneCall import check completed."

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

          "$SDKMANAGER" --version

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${{ steps.sdk.outputs.path }}"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Environment
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          java -version
          ./gradlew --version

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Build-Error-Log
          path: |
            project/app/build/reports/
            project/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
