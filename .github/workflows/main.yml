name: Build SMSIFYHUB Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Project Files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Searching for Gradle files:"
          find . -maxdepth 5 \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name gradle-wrapper.properties \) \
            -print

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found."
            echo "Upload the extracted Android project, not just its ZIP file."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$WRAPPER"

      - name: Build Debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          $GITHUB_WORKSPACE/${{ steps.gradle.outputs.wrapper }} \
            assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
