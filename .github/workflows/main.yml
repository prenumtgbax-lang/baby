name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: smsifyhub-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SMSIFYHUB APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Xmx3g -Dfile.encoding=UTF-8

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install unzip
      - name: Install Utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Verify ZIP and extract project
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SMSIFYHUB_Android_Project_COMPLETED (1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'SMSIFYHUB_Android_Project_COMPLETED (1).zip' \
              -not -path '*/.git/*' \
              -print -quit)"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP was not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -150
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted project files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'gradlew' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) \
            -print

          # Find a Gradle wrapper whose directory contains settings.gradle
          PROJECT_DIR=""

          while IFS= read -r GRADLEW; do
            CANDIDATE="$(dirname "$GRADLEW")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f -name gradlew -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find gradlew and settings.gradle in the same project directory."
            echo "ZIP file listing:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle or app/build.gradle.kts was not found."
            echo "Project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      # 5. Verify Java and Android SDK
      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Java home: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools not found."
            exit 1
          fi

      # 6. Locate SDK Manager
      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "SDK Manager: $SDKMANAGER"

      # 7. Install SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${{ steps.sdk.outputs.path }}"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Make Gradle wrapper executable
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # 9. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          set +e
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Gradle build failed. Check build-error.log for the actual error."
            exit "$BUILD_STATUS"
          fi

      # 10. Verify APK
      - name: Verify APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

          if ! find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "::error::No debug APK was generated."
            exit 1
          fi

      # 11. Upload APK artifact
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # 12. Upload logs if build fails
      - name: Upload Build Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Build-Error-Log
          path: |
            build-error.log
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
