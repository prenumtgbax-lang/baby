name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SMSIFYHUB APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Utilities
      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Extract Android Project
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "SMSIFYHUB_Android_Project_COMPLETED (1).zip" \
            -not -path "*/.git/*" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Searching for Gradle project..."

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f -name gradlew | head -n 1 || true)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            echo "ZIP contents:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      # 5. Fix PhoneCall Import
      - name: Fix PhoneCall Import
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/src/main/java/com/smsifyhub/app/ui/FloatingPopupView.kt"

          if [ -f "$FILE" ]; then
            sed -i \
              '/^import androidx\.compose\.material\.icons\.filled\.PhoneCall$/d' \
              "$FILE"

            echo "PhoneCall import check completed."
          else
            echo "FloatingPopupView.kt not found; skipping import fix."
          fi

      # 6. Verify Java 17
      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          java -version 2>&1 | grep -q '"17\.' || {
            echo "ERROR: Java 17 is required."
            exit 1
          }

      # 7. Locate Android SDK Manager
      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

          "$SDKMANAGER" --version

      # 8. Install Android SDK Packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${{ steps.sdk.outputs.path }}"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. Verify Gradle
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Java version:"
          java -version

          echo "Gradle version:"
          ./gradlew --version

      # 10. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

      # 11. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # 12. Upload Build Error Logs
      - name: Upload Build Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Build-Error-Log
          path: |
            build-error.log
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
