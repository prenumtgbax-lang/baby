name: SMSIFYHUB Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -iname 'SMSIFYHUB_Android_Project_UPDATED.zip' \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 4 -type f | head -150

      - name: Locate Gradle Project
        id: locate
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/project"

          WRAPPER=$(find "$ROOT" -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1 || true)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew missing from ZIP."
            exit 1
          fi

          DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$DIR/settings.gradle" ] && \
             [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          yes | "$SDKMANAGER" --licenses || true

      - name: Detect Required Android SDK
        id: sdk
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -e

          FILE=""
          if [ -f app/build.gradle ]; then
            FILE="app/build.gradle"
          elif [ -f app/build.gradle.kts ]; then
            FILE="app/build.gradle.kts"
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          SDK=$(grep -E 'compileSdk(Version)?[[:space:]=]+[0-9]+' \
            "$FILE" | grep -oE '[0-9]+' | head -n 1 || true)

          if [ -z "$SDK" ]; then
            echo "ERROR: Could not detect compileSdk."
            echo "Check app/build.gradle manually."
            exit 1
          fi

          echo "api=$SDK" >> "$GITHUB_OUTPUT"
          echo "Detected compileSdk: $SDK"

      - name: Install Required Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${{ steps.sdk.outputs.api }}"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
