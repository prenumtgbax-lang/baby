name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: smsifyhub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SMSIFYHUB APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: -Xmx3g -Dfile.encoding=UTF-8

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install unzip
      - name: Install Utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Extract Android project
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/SMSIFYHUB_Android_Project_COMPLETED (1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'SMSIFYHUB_Android_Project_COMPLETED (1).zip' \
              -not -path '*/.git/*' \
              -print -quit)"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/android_project"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::gradlew not found."
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 5 -type f -name gradlew
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::App Gradle build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      # 5. Fix verified Kotlin errors and SDK path
      - name: Fix Kotlin Errors and SDK Path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()

          # Fix FloatingWindowService.kt
          service = root / "app/src/main/java/com/smsifyhub/app/service/FloatingWindowService.kt"

          if not service.is_file():
              raise SystemExit(f"Missing source file: {service}")

          text = service.read_text(encoding="utf-8")

          old = "flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP"
          new = "addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)"

          if old in text:
              text = text.replace(old, new, 1)
              service.write_text(text, encoding="utf-8")
              print("Fixed Intent flags assignment.")
          elif new in text:
              print("Intent flags assignment already fixed.")
          else:
              raise SystemExit(
                  "Expected Intent flags code not found; refusing to modify unknown code."
              )

          # Fix AuthScreen.kt
          auth = root / "app/src/main/java/com/smsifyhub/app/ui/AuthScreen.kt"

          if not auth.is_file():
              raise SystemExit(f"Missing source file: {auth}")

          text = auth.read_text(encoding="utf-8")
          import_line = "import androidx.compose.foundation.BorderStroke"

          if import_line not in text:
              package_line = "package com.smsifyhub.app.ui"
              if package_line not in text:
                  raise SystemExit("AuthScreen.kt package declaration not found.")

              text = text.replace(
                  package_line,
                  package_line + "\n\n" + import_line,
                  1
              )
              auth.write_text(text, encoding="utf-8")
              print("Added BorderStroke import.")
          else:
              print("BorderStroke import already exists.")

          # Replace the machine-specific SDK path with the runner SDK path.
          local_properties = root / "local.properties"
          local_properties.write_text(
              "sdk.dir=" + str(Path("/usr/local/lib/android/sdk")) + "\n",
              encoding="utf-8"
          )

          print("Updated local.properties SDK path.")
          PY

          echo "Kotlin and SDK corrections completed."

      # 6. Verify Java and SDK
      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          java -version

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools"

          echo "Java and Android SDK directories verified."

      # 7. Locate Android SDK Manager
      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found."
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      # 8. Install required Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${{ steps.sdk.outputs.path }}"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. Verify Gradle
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # 10. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          set +e

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Android build failed. Check the Kotlin or Gradle errors above."
            exit "$BUILD_STATUS"
          fi

      # 11. Verify APK exists
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if ! find "$APK_DIR" \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk'

      # 12. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # 13. Upload error logs if failed
      - name: Upload Build Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Build-Error-Log
          path: |
            build-error.log
            extracted/android_project/app/build/reports/**
            extracted/android_project/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
