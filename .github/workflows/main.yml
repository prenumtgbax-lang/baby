name: SMSIFYHUB Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "SMSIFYHUB_Android_Project_UPDATED.zip" \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository."
            echo "Upload SMSIFYHUB_Android_Project_UPDATED.zip first."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 -type f | head -200

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          WRAPPER=$(find "$ROOT" \
            -type f \
            -name gradlew \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found in the extracted ZIP."
            echo "The ZIP may not contain a complete Gradle project."
            echo "Inspect the extracted files in the previous step."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found beside gradlew."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project: $PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSIFYHUB-Android-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
